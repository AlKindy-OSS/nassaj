<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>نساج</title>
    <style>
      :root {
        background: #10192c;
      }

      body {
        display: grid;
        min-block-size: 100svh;
        margin: 0;
        place-items: center;
      }

      .nassaj-logo {
        display: block;
        inline-size: min(320px, calc(100% - 48px));
        aspect-ratio: 3.672 / 1;
      }

      .nassaj-logo img {
        display: block;
        inline-size: 100%;
        block-size: 100%;
      }
    </style>
  </head>
  <body>
    <main class="nassaj-logo">
      <img src="nassaj-logo-on-dark.svg" alt="نسّاج">
    </main>
  </body>
</html>
